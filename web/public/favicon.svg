<?xml version="1.0" encoding="UTF-8"?>
<!-- Browser tab icon: the shared K-mark on the viewer's own palette.

     Geometry is copied verbatim from apple/KMTV/.../logo.svg and
     android/assets/brand/icon.svg so all three platforms carry the same mark;
     only the fills differ. The gradients, drop shadow and four-tone K of the
     Apple icon are dropped on purpose — none of them survive a 16px tab, and
     flat fills stay legible there.

     Colours are the accent-text (#0b1220) and accent (#bfdbfe) custom properties
     from web/src/style.css, so the icon reads as the same product as the page.
     (Their names are written without the leading dashes because XML comments
     cannot contain a double hyphen.)
     A dark plate keeps the mark visible on a light tab strip, and the light K
     keeps it visible on a dark one.

     apple-touch-icon.png in this directory is rendered from this file with the
     corner radius removed (iOS masks its own):
       sed 's/ rx="192" ry="192"//' favicon.svg | rsvg-convert -w 180 -h 180 -o apple-touch-icon.png
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <rect width="1024" height="1024" rx="192" ry="192" fill="#0b1220"/>
  <g fill="#bfdbfe">
    <polygon points="501.0,341 647.5,341 810,170 662,170"/>
    <polygon points="340,512 485,512 647.5,341 501.0,341"/>
    <polygon points="501.0,683 647.5,683 810,854 662,854"/>
    <polygon points="340,512 485,512 647.5,683 501.0,683"/>
    <rect x="195" y="170" width="145" height="684" rx="6" ry="6"/>
  </g>
</svg>
